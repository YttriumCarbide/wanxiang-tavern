plugins {
    id 'com.android.application' version '8.13.2'
}

def offlinePackDir = file('../../.runtime/native/offline-pack')
def requiredPackFiles = ['index.html', 'manifest.json', 'chunks.json']

android {
    namespace 'app.wanxiang.tavern'
    compileSdk 36

    defaultConfig {
        applicationId 'app.wanxiang.tavern'
        minSdk 26
        targetSdk 36
        versionCode providers.gradleProperty('wanxiangVersionCode').getOrElse('20300').toInteger()
        versionName providers.gradleProperty('wanxiangVersion').getOrElse('2.3.0')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs = [offlinePackDir]
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.16.0'
}

tasks.register('verifyFirstPack') {
    def packDir = offlinePackDir
    def required = requiredPackFiles
    doLast {
        def missing = required.findAll { !new File(packDir, it).isFile() }
        if (missing) {
            throw new GradleException("Offline pack at ${packDir} is missing required files: ${missing.join(', ')}")
        }
    }
}

tasks.named('preBuild') {
    dependsOn 'verifyFirstPack'
}
