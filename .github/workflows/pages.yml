name: Deploy game to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 万象酒馆-Demo/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Install build dependencies
        run: npm ci
        working-directory: 万象酒馆-Demo
      - name: Build clean static release
        run: npm run build
        working-directory: 万象酒馆-Demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 万象酒馆-Demo/dist
      - uses: actions/deploy-pages@v5
        id: deployment
