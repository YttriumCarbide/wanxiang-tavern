name: Release v2.3

on:
  push:
    tags:
      - v2.3

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: 万象酒馆-Demo/package-lock.json

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 36 and Build Tools 35.0.0
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"

      - name: Install dependencies
        working-directory: 万象酒馆-Demo
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: 万象酒馆-Demo
        run: npx playwright install --with-deps chromium

      - name: Run release checks
        working-directory: 万象酒馆-Demo
        env:
          TEST_BROWSER: chromium
        run: npm test

      - name: Build static release
        working-directory: 万象酒馆-Demo
        run: npm run build

      - name: Check native artifacts
        working-directory: 万象酒馆-Demo
        run: npm run check:native

      - name: Build Windows package
        working-directory: 万象酒馆-Demo
        run: npm run build:pc

      - name: Zip Windows package
        working-directory: 万象酒馆-Demo
        run: |
          test -d .runtime/native/pc-win-x64
          cd .runtime/native
          zip -r wanxiang-tavern-2.3-windows-x64.zip pc-win-x64
          test -f wanxiang-tavern-2.3-windows-x64.zip

      - name: Build Android package
        working-directory: 万象酒馆-Demo
        env:
          WANXIANG_ANDROID_VERSION_CODE: "20300"
        run: npm run build:android

      - name: Copy Android APK
        working-directory: 万象酒馆-Demo
        run: |
          APK=native/android/build/outputs/apk/debug/WanxiangTavern-debug.apk
          test -f "$APK"
          cp "$APK" .runtime/native/wanxiang-tavern-2.3-android.apk
          test -f .runtime/native/wanxiang-tavern-2.3-android.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3
          name: v2.3
          body: |
            2.3 完整资源包：修复攻击特效偶发出现在屏幕左上角的问题，并在开始界面和设置页提供下载入口。
            Android APK 安装后即可读取全部游戏资源；Windows ZIP 解压后运行 WanxiangTavern.exe。
            无需热更新或额外下载资源。AI 功能仍需自行配置联网接口。
          files: |
            万象酒馆-Demo/.runtime/native/wanxiang-tavern-2.3-windows-x64.zip
            万象酒馆-Demo/.runtime/native/wanxiang-tavern-2.3-android.apk
