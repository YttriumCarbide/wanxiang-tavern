name: Release installation packages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: 万象酒馆-Demo/package-lock.json

      - name: Verify release version
        id: version
        working-directory: 万象酒馆-Demo
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const version = pkg.version;
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;

          if (typeof version !== 'string' || !semver.test(version)) {
            throw new Error(`package.json version is not a valid semantic version: ${version}`);
          }

          const expected = `v${version}`;
          if (process.env.GITHUB_REF_NAME !== expected) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match package version ${expected}`);
          }

          appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${version}\n`);
          NODE

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 36 and Build Tools 35.0.0
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"

      - name: Install dependencies
        working-directory: 万象酒馆-Demo
        run: npm ci

      - name: Run source quality checks
        working-directory: 万象酒馆-Demo
        run: |
          status=0
          node tools/test.mjs --scope quality || status=$?
          if [ "$status" -ne 0 ]; then cat .runtime/tests/report.json; fi
          exit "$status"

      - name: Build static release
        working-directory: 万象酒馆-Demo
        run: npm run build

      - name: Check native artifacts
        working-directory: 万象酒馆-Demo
        run: npm run check:native

      - name: Build Windows package
        working-directory: 万象酒馆-Demo
        run: npm run build:pc

      - name: Zip Windows package
        working-directory: 万象酒馆-Demo
        run: |
          test -d .runtime/native/pc-win-x64
          cd .runtime/native
          zip -r "wanxiang-tavern-${{ env.RELEASE_VERSION }}-windows-x64.zip" pc-win-x64
          test -f "wanxiang-tavern-${{ env.RELEASE_VERSION }}-windows-x64.zip"

      - name: Build Android package
        working-directory: 万象酒馆-Demo
        run: npm run build:android

      - name: Copy Android APK
        working-directory: 万象酒馆-Demo
        run: |
          APK=native/android/build/outputs/apk/debug/WanxiangTavern-debug.apk
          test -f "$APK"
          cp "$APK" ".runtime/native/wanxiang-tavern-${{ env.RELEASE_VERSION }}-android.apk"
          test -f ".runtime/native/wanxiang-tavern-${{ env.RELEASE_VERSION }}-android.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          body: |
            存档导入反馈与兼容性修复，完整离线安装包。
            Android APK 使用调试签名；Windows ZIP 解压后运行 WanxiangTavern.exe。
            两端包含完整运行资源，AI 功能仍需自行配置联网接口。
          files: |
            万象酒馆-Demo/.runtime/native/wanxiang-tavern-${{ env.RELEASE_VERSION }}-windows-x64.zip
            万象酒馆-Demo/.runtime/native/wanxiang-tavern-${{ env.RELEASE_VERSION }}-android.apk
